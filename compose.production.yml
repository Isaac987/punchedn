# docker-compose.prod.yml
services:
  backend:
    build:
      context: ./backend
      target: production # Uses the Gunicorn stage with the clean .venv
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      target: production # Uses the Nginx stage serving compiled static assets
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Mount a separate production Caddyfile
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:
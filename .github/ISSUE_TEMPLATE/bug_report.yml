name: Bug report
description: Something isn't working as expected.
title: "fix: "
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown on the status page or by `punchedn status`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: request_id
    attributes:
      label: Request ID
      description: Shown with unexpected error messages. Leave blank if there wasn't one.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include logs or screenshots. Remove personal data and secrets first.
    validations:
      required: true
